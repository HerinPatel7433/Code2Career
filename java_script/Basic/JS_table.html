<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script</title>
    <script>
        var total = 1000;
        var perColumn = 10;
        var columns = Math.ceil(total / perColumn);

        document.write("<table border='1'>");
        for (var row = 0; row < perColumn; row++) {
            document.write("<tr>");
            for (var col = 0; col < columns; col++) {
                var value = col * perColumn + row + 1;
                if (value <= total) {
                    var color = value % 2 === 0 ? 'red' : 'yellow';
                    document.write("<td bgcolor='" + color + "'>" + value + "</td>");
                } else {
                    document.write("<td></td>");
                }
            }
            document.write("</tr>");
        }
        document.write("</table>");
    </script>
</head>
<body>
</body>
</html>
